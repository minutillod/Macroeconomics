name: Download RBA Graphs

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
#Added to allow for files to be saved
permissions:
  contents: write
  
defaults:
  run:
    shell: bash
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.0

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install requests cairosvg

      - name: Download files
        run: python scr/getRBAGraphs.py

      - name: Upload downloads
        uses: actions/upload-artifact@v5.0.0
        with:
          name: Images
          path: downloaded_files/

      # Copy PNG images to the repository
      - name: Save PNG images to repository
        run: |
          mkdir -p Images/Dynamic/RBA
          cp downloaded_files/*.png Images/Dynamic/RBA/

      # Commit and push updated images
      - name: Commit and push images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add Images/Dynamic/RBA/*.png

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update RBA graphs (automated)"
            git push origin HEAD:${{ github.ref }}
          fi

